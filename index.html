<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hausplan – Flur & Winterdienst</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hausplan">
  <meta name="theme-color" content="#ffffff">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23111111'/%3E%3Ctext x='50' y='67' font-family='Arial, sans-serif' font-size='52' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23111111'/%3E%3Ctext x='50' y='67' font-family='Arial, sans-serif' font-size='52' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Hausplan%20%E2%80%93%20Flur%20%26%20Winterdienst%22%2C%22short_name%22%3A%22Hausplan%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%23111111%22%7D">

  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f7f7;
      --border: #d4d4d4;
      --border-active: #111111;
      --text-main: #111111;
      --text-muted: #555555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 20px 16px 40px;
      max-width: 520px;
      margin: 0 auto;
      line-height: 1.4;
    }

    header {
      border-bottom: 2px solid var(--text-main);
      padding-bottom: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .week-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 16px;
      border-radius: 4px;
    }

    .card.current {
      border: 2.5px solid var(--border-active);
      background: var(--surface);
      padding: 20px 18px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }

    .badge {
      background: var(--text-main);
      color: var(--bg);
      padding: 2px 7px;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 2px;
    }

    .party {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    .card.current .party {
      font-size: 2.1rem;
    }

    .note {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
    }

    .footer {
      margin-top: 28px;
      font-size: 0.78rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #111;
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Hausplan</h1>
    <span class="subtitle">Flurwoche & Winterdienst</span>
  </header>

  <main class="week-list" id="schedule">
    <div class="card">Lade aktuellen Plan...</div>
  </main>

  <footer class="footer">
    <div class="footer-row">
      <span id="sync-status"><span class="status-dot"></span>Lade Kalenderdaten...</span>
      <span>Turnus: Mo – So</span>
    </div>
    <div class="footer-row" id="debug-info" style="font-size: 0.72rem; opacity: 0.8;"></div>
  </footer>

  <script>
    const CALENDAR_FILE = "./calendar.ics?t=" + Date.now();
    const ANCHOR_MONDAY = new Date(2026, 10, 16);
    const ROTATION = ["RECHTS", "LINKS", "MITTE"];

    function getMonday(d) {
      const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function getISOWeek(d) {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    }

    function fmtDate(d) {
      return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.';
    }

    // Wandelt ein Datum in einen reinen Tages-Schlüssel (YYYY-MM-DD) in Lokalzeit um
    function toLocalDayKey(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    // Wandelt ein ICAL.Time-Objekt sicher in ein lokales Datum (Mitternacht) um
    function icalTimeToLocalMidnight(icalTime) {
      if (!icalTime) return null;
      return new Date(icalTime.year, icalTime.month - 1, icalTime.day, 0, 0, 0, 0);
    }

    function getDefaultParty(weekMonday) {
      const msPerWeek = 7 * 24 * 60 * 60 * 1000;
      const diffWeeks = Math.round((weekMonday - ANCHOR_MONDAY) / msPerWeek);
      const index = ((diffWeeks % 3) + 3) % 3;
      return ROTATION[index];
    }

    async function loadCalendarEvents(weeks) {
      const response = await fetch(CALENDAR_FILE, { cache: "no-store" });
      if (!response.ok) throw new Error("calendar.ics nicht gefunden (" + response.status + ")");
      const icsText = await response.text();
      if (!icsText.includes("BEGIN:VCALENDAR")) throw new Error("Keine gültige ICS-Datei");

      const jcalData = ICAL.parse(icsText);
      const comp = new ICAL.Component(jcalData);
      const vevents = comp.getAllSubcomponents("vevent");

      const rangeStartDay = new Date(weeks[0].monday.getFullYear(), weeks[0].monday.getMonth(), weeks[0].monday.getDate());
      const rangeEndDay = new Date(weeks[3].sunday.getFullYear(), weeks[3].sunday.getMonth(), weeks[3].sunday.getDate() + 1);
      const rangeEndIcal = ICAL.Time.fromJSDate(rangeEndDay, false);

      const exceptions = {};
      vevents.forEach(ve => {
        const event = new ICAL.Event(ve);
        if (event.isRecurrenceException()) {
          const uid = event.uid;
          const recId = event.recurrenceId ? event.recurrenceId.toString() : "";
          if (!exceptions[uid]) exceptions[uid] = {};
          exceptions[uid][recId] = event;
        }
      });

      const occurrences = [];

      vevents.forEach(ve => {
        const event = new ICAL.Event(ve);
        if (event.isRecurrenceException()) return;

        if (event.isRecurring()) {
          const iter = event.iterator();
          let next;
          let safety = 0;
          while ((next = iter.next()) && safety < 500) {
            safety++;
            if (next.compare(rangeEndIcal) > 0) break;

            const recKey = next.toString();
            const actualEvent = (exceptions[event.uid] && exceptions[event.uid][recKey])
              ? exceptions[event.uid][recKey]
              : event;

            const startSource = (exceptions[event.uid] && exceptions[event.uid][recKey])
              ? actualEvent.startDate
              : next;

            const startDay = icalTimeToLocalMidnight(startSource);
            const origStartDay = icalTimeToLocalMidnight(actualEvent.startDate);
            const origEndDay = icalTimeToLocalMidnight(actualEvent.endDate);

            let spanDays = 1;
            if (origStartDay && origEndDay) {
              spanDays = Math.max(1, Math.round((origEndDay - origStartDay) / 86400000));
            }

            const endDay = new Date(startDay.getFullYear(), startDay.getMonth(), startDay.getDate() + spanDays);

            if (endDay > rangeStartDay && startDay < rangeEndDay) {
              occurrences.push({
                title: (actualEvent.summary || "").trim(),
                desc: (actualEvent.description || "").trim(),
                startDay,
                endDay
              });
            }
          }
        } else {
          const startDay = icalTimeToLocalMidnight(event.startDate);
          const endDay = icalTimeToLocalMidnight(event.endDate);
          if (startDay && endDay && endDay > rangeStartDay && startDay < rangeEndDay) {
            occurrences.push({
              title: (event.summary || "").trim(),
              desc: (event.description || "").trim(),
              startDay,
              endDay
            });
          }
        }
      });

      return { occurrences, totalVevents: vevents.length };
    }

    async function render() {
      const today = new Date();
      const currentMonday = getMonday(today);
      const weeks = [];

      for (let i = 0; i < 4; i++) {
        const mon = new Date(currentMonday.getFullYear(), currentMonday.getMonth(), currentMonday.getDate() + (i * 7));
        const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
        // Die 7 Tage der Woche als Mitternachts-Daten
        const days = [];
        for (let d = 0; d < 7; d++) {
          days.push(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + d));
        }
        weeks.push({
          index: i,
          kw: getISOWeek(mon),
          monday: mon,
          sunday: sun,
          days,
          party: getDefaultParty(mon),
          note: "",
          matchedFromCalendar: false
        });
      }

      const statusEl = document.getElementById("sync-status");
      const debugEl = document.getElementById("debug-info");

      try {
        const { occurrences, totalVevents } = await loadCalendarEvents(weeks);

        weeks.forEach(w => {
          // Alle Termine sammeln, die mindestens an einem Tag dieser Woche aktiv sind
          const matched = occurrences.filter(occ =>
            w.days.some(day => day >= occ.startDay && day < occ.endDay)
          );

          if (matched.length > 0) {
            // Dubletten (gleicher Titel + gleiche Beschreibung) entfernen
            const unique = [];
            const seen = new Set();
            matched.forEach(m => {
              const key = `${m.title}|||${m.desc}`;
              if (!seen.has(key)) {
                seen.add(key);
                unique.push(m);
              }
            });

            w.party = unique.map(u => u.title).filter(Boolean).join(" / ") || w.party;
            w.note = unique.map(u => u.desc).filter(Boolean).join(" · ");
            w.matchedFromCalendar = true;
          }
        });

        const matchedWeeksCount = weeks.filter(w => w.matchedFromCalendar).length;
        statusEl.innerHTML = `<span class="status-dot"></span>Kalender gelesen (${matchedWeeksCount}/4 Wochen aus Kalender)`;
        debugEl.textContent = `Termine im Export: ${totalVevents} · Treffer in 4 Wochen: ${occurrences.length}`;
      } catch (e) {
        statusEl.innerHTML = '<span class="status-dot"></span>Standard-Turnus (Kalender nicht lesbar)';
        debugEl.textContent = 'Hinweis: ' + e.message;
      }

      const container = document.getElementById("schedule");
      container.innerHTML = weeks.map(w => {
        const isCurrent = w.index === 0;
        const label = isCurrent ? "Aktuelle Woche" : (w.index === 1 ? "Nächste Woche" : `In ${w.index} Wochen`);
        return `
          <div class="card ${isCurrent ? 'current' : ''}">
            <div class="card-header">
              <span>KW ${w.kw} · ${fmtDate(w.monday)} – ${fmtDate(w.sunday)}</span>
              ${isCurrent ? '<span class="badge">AKTUELL</span>' : `<span>${label}</span>`}
            </div>
            <div class="party">${escapeHtml(w.party)}</div>
            ${w.note ? `<div class="note">${escapeHtml(w.note)}</div>` : ''}
          </div>
        `;
      }).join("");
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    render();
  </script>
</body>
</html>
